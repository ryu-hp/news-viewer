<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Morning Brief">
<meta name="theme-color" content="#ffffff" id="js-theme-color">
<meta name="color-scheme" content="light">
<script>
  (function () {
    var theme = "light";
    try {
      theme = localStorage.getItem("mb-theme") === "dark" ? "dark" : "light";
    } catch (e) {
      theme = "light";
    }
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<meta name="description" content="毎朝の世界・日本の最新ニュースを落ち着いて読むためのニュースビューワー">
<title>Morning Brief｜朝のニュースブリーフ</title>

<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">

<style>
  /* =========================================================
     Morning Brief — News Viewer
     Design: 白基調のニュース紙面型（白地＋墨色＋薄グレー罫線）
     カテゴリ色はラベル・見出しマーカーのみのアクセント
     ========================================================= */

  :root {
    --font-sans: "DM Sans", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", system-ui, -apple-system, sans-serif;

    /* Base palette — light（既定・OSのダーク設定に関わらず白） */
    --color-bg: #ffffff;
    --color-surface: #ffffff;
    --color-surface-sub: #f5f6f7;
    --color-ink: #16181b;
    --color-ink-body: #33373d;
    --color-ink-soft: #555b63;
    --color-ink-muted: #858b93;
    --color-line: #e6e8eb;
    --color-line-strong: #cfd3d8;
    --color-rule: #16181b;
    --color-accent: #1d3f73;
    --color-alert: #c8102e;
    --color-on-accent: #ffffff;

    /* Category accents（アクセント程度） */
    --cat-politics: #1d3f73;
    --cat-economy: #1d6b48;
    --cat-realestate: #8a5a12;
    --cat-tech: #1f62c4;
    --cat-sports: #c2470f;
    --cat-world: #8c2f39;
    --cat-education: #5b4a8a;
    --cat-society: #4a5868;
    --cat-science: #1f6f78;
    --cat-culture: #9a4f33;
    --cat-default: #555b63;

    --radius-sm: 6px;
    --maxw: 680px;
    --gutter: 20px;
  }

  :root[data-theme="dark"] {
    --color-bg: #121417;
    --color-surface: #121417;
    --color-surface-sub: #1c1f24;
    --color-ink: #eceef1;
    --color-ink-body: #c9cdd3;
    --color-ink-soft: #a5abb3;
    --color-ink-muted: #7d848d;
    --color-line: #262a30;
    --color-line-strong: #363b43;
    --color-rule: #eceef1;
    --color-accent: #8fb0e6;
    --color-alert: #ff6b6b;
    --color-on-accent: #121417;

    --cat-politics: #8fb0e6;
    --cat-economy: #6cc196;
    --cat-realestate: #d6a95c;
    --cat-tech: #7fa9ec;
    --cat-sports: #f0995e;
    --cat-world: #e08a95;
    --cat-education: #b2a3dc;
    --cat-society: #a8b4c2;
    --cat-science: #6cc3cc;
    --cat-culture: #dc977c;
    --cat-default: #a5abb3;
  }

  * {
    box-sizing: border-box;
  }

  html {
    -webkit-text-size-adjust: 100%;
    background: var(--color-bg);
  }

  body {
    margin: 0;
    font-family: var(--font-sans);
    background: var(--color-bg);
    color: var(--color-ink);
    line-height: 1.75;
    font-size: 16px;
    letter-spacing: 0.01em;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  a {
    color: inherit;
  }

  /* ---------- Layout ---------- */

  .l-shell {
    max-width: var(--maxw);
    margin: 0 auto;
    padding: 0 var(--gutter) calc(48px + env(safe-area-inset-bottom));
  }

  /* ---------- Header（紙面の題字） ---------- */

  .p-header {
    padding: calc(20px + env(safe-area-inset-top)) 0 16px;
    border-bottom: 3px solid var(--color-rule);
  }

  .p-header__top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-bottom: 14px;
    margin-bottom: 14px;
    border-bottom: 1px solid var(--color-line);
  }

  .p-header__brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0;
  }

  .p-header__mark {
    flex: 0 0 auto;
    width: 26px;
    height: 26px;
    color: var(--color-ink);
  }

  .p-header__titles {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 0 10px;
    line-height: 1.2;
  }

  .p-header__title {
    margin: 0;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--color-ink);
  }

  .p-header__subtitle {
    font-size: 11.5px;
    font-weight: 500;
    color: var(--color-ink-muted);
    letter-spacing: 0.12em;
  }

  .p-header__theme {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    padding: 0;
    border: 1px solid var(--color-line);
    border-radius: 50%;
    background: var(--color-surface);
    color: var(--color-ink-soft);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .p-header__theme:focus-visible {
    outline: 2px solid var(--color-accent);
    outline-offset: 2px;
  }

  .p-header__theme-icon {
    width: 18px;
    height: 18px;
  }

  .p-header__theme-icon--sun {
    display: none;
  }

  :root[data-theme="dark"] .p-header__theme-icon--sun {
    display: block;
  }

  :root[data-theme="dark"] .p-header__theme-icon--moon {
    display: none;
  }

  .p-header__meta {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .p-header__date {
    font-size: 24px;
    font-weight: 700;
    line-height: 1.35;
    letter-spacing: 0.01em;
    color: var(--color-ink);
  }

  .p-header__coverage {
    font-size: 12.5px;
    color: var(--color-ink-soft);
  }

  .p-header__status {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 16px;
    margin-top: 8px;
    font-size: 12px;
    color: var(--color-ink-muted);
    letter-spacing: 0.03em;
  }

  .p-header__status-item {
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  .p-header__status-icon {
    width: 13px;
    height: 13px;
  }

  /* ---------- Date navigation ---------- */

  .c-datenav {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 0;
    border-bottom: 1px solid var(--color-line);
  }

  .c-datenav__btn {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border: 1px solid var(--color-line-strong);
    border-radius: var(--radius-sm);
    background: var(--color-surface);
    color: var(--color-ink);
    cursor: pointer;
    transition: background 0.16s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .c-datenav__btn:active {
    background: var(--color-surface-sub);
  }

  .c-datenav__btn:disabled {
    color: var(--color-line-strong);
    border-color: var(--color-line);
    cursor: default;
  }

  .c-datenav__btn:focus-visible {
    outline: 2px solid var(--color-accent);
    outline-offset: 2px;
  }

  .c-datenav__btn-icon {
    width: 18px;
    height: 18px;
  }

  .c-datenav__field {
    position: relative;
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    align-items: center;
  }

  .c-datenav__field-icon {
    position: absolute;
    left: 12px;
    width: 16px;
    height: 16px;
    color: var(--color-ink-soft);
    pointer-events: none;
  }

  .c-datenav__select {
    width: 100%;
    min-height: 40px;
    padding: 8px 34px 8px 36px;
    border: 1px solid var(--color-line-strong);
    border-radius: var(--radius-sm);
    background: var(--color-surface);
    color: var(--color-ink);
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 600;
    letter-spacing: 0.02em;
    line-height: 1.4;
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
    -webkit-tap-highlight-color: transparent;
    text-overflow: ellipsis;
  }

  .c-datenav__select:focus-visible {
    outline: 2px solid var(--color-accent);
    outline-offset: 2px;
  }

  .c-datenav__caret {
    position: absolute;
    right: 12px;
    width: 16px;
    height: 16px;
    color: var(--color-ink-muted);
    pointer-events: none;
  }

  /* ---------- Controls（カテゴリタブ＋重要のみ） ---------- */

  .p-controls {
    position: sticky;
    top: 0;
    z-index: 10;
    margin: 0 calc(var(--gutter) * -1) 4px;
    padding: 0 var(--gutter);
    background: var(--color-bg);
    border-bottom: 1px solid var(--color-line);
  }

  .c-filterbar {
    display: flex;
    gap: 2px;
    margin: 0 calc(var(--gutter) * -1);
    padding: 0 var(--gutter);
    overflow-x: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
    scroll-snap-type: x proximity;
  }

  .c-filterbar::-webkit-scrollbar {
    display: none;
  }

  .c-chip {
    position: relative;
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    min-height: 46px;
    padding: 0 10px;
    border: 0;
    background: transparent;
    color: var(--color-ink-soft);
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 600;
    letter-spacing: 0.02em;
    white-space: nowrap;
    cursor: pointer;
    scroll-snap-align: start;
    transition: color 0.16s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .c-chip::after {
    content: "";
    position: absolute;
    left: 10px;
    right: 10px;
    bottom: 0;
    height: 3px;
    background: transparent;
  }

  .c-chip__count {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--color-ink-muted);
    letter-spacing: 0;
  }

  .c-chip.is-active {
    color: var(--color-ink);
  }

  .c-chip.is-active::after {
    background: var(--chip-color, var(--color-rule));
  }

  .c-chip:focus-visible {
    outline: 2px solid var(--color-accent);
    outline-offset: -4px;
  }

  .c-toggle {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 8px 0;
    border-top: 1px solid var(--color-line);
  }

  .c-toggle__label {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 32px;
    font-size: 13px;
    font-weight: 600;
    color: var(--color-ink-soft);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .c-toggle__switch {
    position: relative;
    order: 2;
    width: 40px;
    height: 23px;
    flex: 0 0 auto;
    border-radius: 999px;
    background: var(--color-line-strong);
    transition: background 0.18s ease;
  }

  .c-toggle__switch::after {
    content: "";
    position: absolute;
    top: 3px;
    left: 3px;
    width: 17px;
    height: 17px;
    border-radius: 50%;
    background: #ffffff;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
    transition: transform 0.18s ease;
  }

  .c-toggle__input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
  }

  .c-toggle__input:checked + .c-toggle__switch {
    background: var(--color-alert);
  }

  .c-toggle__input:checked + .c-toggle__switch::after {
    transform: translateX(17px);
  }

  .c-toggle__input:focus-visible + .c-toggle__switch {
    outline: 2px solid var(--color-accent);
    outline-offset: 2px;
  }

  /* ---------- Feed ---------- */

  .p-feed {
    display: flex;
    flex-direction: column;
  }

  .p-section__heading {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin: 32px 0 0;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--color-rule);
  }

  .p-section__heading:first-child {
    margin-top: 20px;
  }

  .p-section__bar {
    flex: 0 0 auto;
    align-self: center;
    width: 10px;
    height: 10px;
    background: var(--cat-color, var(--cat-default));
  }

  .p-section__name {
    margin: 0;
    font-size: 19px;
    font-weight: 700;
    line-height: 1.4;
    letter-spacing: 0.04em;
    color: var(--color-ink);
  }

  .p-section__num {
    margin-left: auto;
    font-size: 12px;
    font-weight: 600;
    color: var(--color-ink-muted);
  }

  /* ---------- Card（罫線区切りの記事ブロック） ---------- */

  .c-card {
    padding: 18px 0 16px;
    border-bottom: 1px solid var(--color-line);
  }

  .c-card__badges {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 10px;
    margin-bottom: 7px;
    font-size: 12px;
    line-height: 1.5;
  }

  .c-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    line-height: 1.5;
    white-space: nowrap;
  }

  .c-badge--category {
    color: var(--cat-color, var(--cat-default));
  }

  .c-badge--importance {
    color: var(--color-ink-muted);
    font-weight: 600;
  }

  .c-badge--importance .c-badge__icon {
    display: none;
  }

  .c-badge--high {
    order: -1;
    padding: 1px 7px;
    border-radius: 3px;
    background: var(--color-alert);
    color: var(--color-on-accent);
    font-weight: 700;
  }

  .c-badge--region {
    color: var(--color-ink-muted);
    font-weight: 500;
  }

  .c-badge__icon {
    width: 12px;
    height: 12px;
  }

  .c-card__title {
    margin: 0 0 8px;
    font-size: 18px;
    font-weight: 700;
    line-height: 1.5;
    letter-spacing: 0.01em;
    color: var(--color-ink);
  }

  .c-card--high .c-card__title {
    font-size: 19.5px;
    line-height: 1.45;
  }

  .c-card__summary {
    margin: 0 0 12px;
    font-size: 15px;
    line-height: 1.85;
    color: var(--color-ink-body);
  }

  .c-insight {
    display: flex;
    gap: 9px;
    padding: 10px 12px;
    margin: 0 0 12px;
    background: var(--color-surface-sub);
    border-left: 3px solid var(--cat-color, var(--cat-default));
  }

  .c-insight__icon {
    flex: 0 0 auto;
    width: 16px;
    height: 16px;
    margin-top: 3px;
    color: var(--color-ink-soft);
  }

  .c-insight__body {
    min-width: 0;
  }

  .c-insight__label {
    display: block;
    margin-bottom: 1px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--color-ink-muted);
  }

  .c-insight__text {
    margin: 0;
    font-size: 14px;
    line-height: 1.75;
    color: var(--color-ink);
  }

  .c-card__footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .c-card__source {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 0 8px;
    min-width: 0;
    font-size: 12.5px;
    line-height: 1.5;
  }

  .c-card__source-name {
    font-weight: 600;
    color: var(--color-ink-soft);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 100%;
  }

  .c-card__published {
    color: var(--color-ink-muted);
    font-size: 12px;
  }

  .c-link {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    min-height: 40px;
    padding: 0 2px 0 12px;
    color: var(--color-accent);
    font-size: 13.5px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }

  .c-link:active {
    opacity: 0.7;
  }

  .c-link:focus-visible {
    outline: 2px solid var(--color-accent);
    outline-offset: 2px;
  }

  .c-link__icon {
    width: 14px;
    height: 14px;
  }

  /* ---------- States (loading / empty / error) ---------- */

  .c-state {
    display: none;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 56px 24px;
    color: var(--color-ink-muted);
  }

  .c-state.is-visible {
    display: flex;
  }

  .c-state__icon {
    width: 40px;
    height: 40px;
    margin-bottom: 16px;
    color: var(--color-line-strong);
  }

  .c-state__title {
    margin: 0 0 6px;
    font-size: 16px;
    font-weight: 700;
    color: var(--color-ink-soft);
  }

  .c-state__text {
    max-width: 32ch;
    margin: 0 0 18px;
    font-size: 13.5px;
    line-height: 1.7;
  }

  .c-state__retry {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    min-height: 42px;
    padding: 10px 18px;
    border: 1px solid var(--color-line-strong);
    border-radius: var(--radius-sm);
    background: var(--color-surface);
    color: var(--color-ink);
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .c-state__retry-icon {
    width: 15px;
    height: 15px;
  }

  /* Spinner */

  .c-spinner {
    width: 32px;
    height: 32px;
    margin-bottom: 16px;
    border: 3px solid var(--color-line);
    border-top-color: var(--color-ink);
    border-radius: 50%;
    animation: c-spin 0.8s linear infinite;
  }

  @keyframes c-spin {
    to {
      transform: rotate(360deg);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .c-spinner {
      animation-duration: 2s;
    }
  }

  /* ---------- Footer ---------- */

  .p-footer {
    margin-top: 40px;
    padding-top: 18px;
    border-top: 3px solid var(--color-rule);
    text-align: center;
    font-size: 11.5px;
    line-height: 1.7;
    color: var(--color-ink-muted);
    letter-spacing: 0.03em;
  }

  .p-footer p {
    margin: 0;
  }

  /* ---------- Responsive ---------- */

  @media (max-width: 767px) {
    :root {
      --gutter: 16px;
    }

    body {
      font-size: 15.5px;
    }

    .l-shell {
      padding-bottom: calc(40px + env(safe-area-inset-bottom));
    }

    .p-header__title {
      font-size: 20px;
    }

    .p-header__date {
      font-size: 21px;
    }

    .p-section__name {
      font-size: 18px;
    }

    .c-card__title {
      font-size: 17px;
    }

    .c-card--high .c-card__title {
      font-size: 18.5px;
    }

    .c-card__summary {
      font-size: 14.5px;
    }
  }
</style>
</head>

<body>
  <div class="l-shell">

    <header class="p-header">
      <div class="p-header__top">
        <p class="p-header__brand">
          <svg class="p-header__mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 5h13a1 1 0 0 1 1 1v12a2 2 0 0 0 2-2V8"></path>
            <path d="M18 18a2 2 0 0 1-2-2V4a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v14a2 2 0 0 0 2 2h11"></path>
            <line x1="7" y1="8" x2="14" y2="8"></line>
            <line x1="7" y1="11.5" x2="14" y2="11.5"></line>
            <line x1="7" y1="15" x2="11" y2="15"></line>
          </svg>
          <span class="p-header__titles">
            <span class="p-header__title">Morning Brief</span>
            <span class="p-header__subtitle">朝のニュースブリーフ</span>
          </span>
        </p>
        <button class="p-header__theme" type="button" id="js-theme-toggle" aria-label="ダークモードに切り替え">
          <svg class="p-header__theme-icon p-header__theme-icon--moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

      <!-- Loading -->

      </div>

        <p class="c-state__text" id="js-error-text">データの取得に失敗しました。通信環境を確認して、再読み込みしてください。</p>
        <button class="c-state__retry" type="button" id="js-retry">
          <svg class="c-state__retry-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 11a8 8 0 1 0-2.3 5.7"></path>

  </div>

  <script>
    (function () {
      "use strict";

      var MANIFEST_URL = "./news/index.json";

      function mdUrl(date) {
        return "./news/" + encodeURIComponent(date) + ".md";
      }

      /* カテゴリ表示順・色・日本語名のマスタ（id → 表示名/色） */
      var CATEGORY_META = {
        politics: { name: "政治", color: "var(--cat-politics)" },
        economy: { name: "経済・金融", color: "var(--cat-economy)" },
        realestate: { name: "不動産", color: "var(--cat-realestate)" },
        tech: { name: "テクノロジー・IT", color: "var(--cat-tech)" },
        technology: { name: "テクノロジー・IT", color: "var(--cat-tech)" },
        sports: { name: "スポーツ", color: "var(--cat-sports)" },
        world: { name: "国際", color: "var(--cat-world)" },
        international: { name: "国際", color: "var(--cat-world)" },
        society: { name: "社会", color: "var(--cat-society)" },
        science: { name: "科学", color: "var(--cat-science)" },
        culture: { name: "文化", color: "var(--cat-culture)" },
        /* 旧カテゴリ（2026-10 廃止）。過去日の md 表示用に残す */
        education: { name: "教育", color: "var(--cat-education)" }
      };

      /* MD見出しのカテゴリ日本語名 → id（未知は既定色にフォールバック） */
      var CATEGORY_NAME_INDEX = {
        "政治": "politics",
        "経済・金融": "economy",
        "経済": "economy",
        "金融": "economy",
        "不動産": "realestate",
        "不動産・住宅": "realestate",
        "住宅・不動産": "realestate",
        "住宅": "realestate",
        "不動産・建設": "realestate",
        "テクノロジー・IT": "tech",
        "テクノロジー": "tech",
        "技術": "tech",
        "IT": "tech",
        "スポーツ": "sports",
        "国際": "world",
        "海外": "world",
        "社会": "society",
        "科学": "science",
        "文化": "culture",
        "教育": "education",
        "教育・学習": "education",
        "学習": "education"
      };

      function resolveCategory(name) {
        var id = CATEGORY_NAME_INDEX[name];
        if (!id) {
          return { id: name || "other", color: "var(--cat-default)" };
        }
        var m = CATEGORY_META[id];
        return { id: id, color: m ? m.color : "var(--cat-default)" };
      }

      function normImportance(raw) {
        var v = (raw || "").trim().toLowerCase();
        if (v === "high" || v === "重要") {
          return "high";
        }
        if (v === "low" || v === "参考") {
          return "low";
        }
        return "mid";
      }

      var IMPORTANCE_META = {
        high: { label: "重要", cls: "c-badge--high" },
        mid: { label: "注目", cls: "" },
        low: { label: "参考", cls: "" }
      };

      /* State */
      var state = {
        categories: [],
        activeCategory: "all",
        importantOnly: false,
        dates: [],
        currentDate: null
      };

      /* 直近の再読み込み対象（エラー時の再読込ボタン用） */
      var retryFn = null;

      /* 選択中カテゴリの記憶（localStorage が使えない環境では毎回「すべて」） */
      var CATEGORY_STORAGE_KEY = "mb-activeCategory";

      function storeCategory(id) {
        try {
          localStorage.setItem(CATEGORY_STORAGE_KEY, id);
        } catch (e) {
          /* 保存できない環境では今回の表示のみ切り替える */
        }
      }

      /* 記憶したカテゴリがその日のデータに無ければ all に戻す */
      function restoreCategory(categories) {
        var stored = null;
        try {
          stored = localStorage.getItem(CATEGORY_STORAGE_KEY);
        } catch (e) {
          stored = null;
        }
        if (!stored || stored === "all") {
          return "all";
        }
        var exists = categories.some(function (cat) {
          return cat && cat.id === stored;
        });
        return exists ? stored : "all";
      }

      /* Elements */
      var el = {
        controls: document.getElementById("js-controls"),
        filters: document.getElementById("js-filters"),
        importantOnly: document.getElementById("js-important-only"),
        datenav: document.getElementById("js-datenav"),
        dateSelect: document.getElementById("js-date-select"),
        dateOlder: document.getElementById("js-date-older"),
        dateNewer: document.getElementById("js-date-newer"),
        feed: document.getElementById("js-feed"),
        date: document.getElementById("js-date"),
        coverage: document.getElementById("js-coverage"),
        updated: document.getElementById("js-updated"),
        total: document.getElementById("js-total"),
        stateLoading: document.getElementById("js-state-loading"),
        stateEmpty: document.getElementById("js-state-empty"),
        stateError: document.getElementById("js-state-error"),
        errorText: document.getElementById("js-error-text"),
        retry: document.getElementById("js-retry")
      };

      /* ---------- Utilities ---------- */

      function esc(str) {
        if (str === null || str === undefined) {
          return "";
        }
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function isSafeUrl(url) {
        if (typeof url !== "string") {
          return false;
        }
        return /^https?:\/\//i.test(url.trim());
      }

      function catMeta(id) {
        if (CATEGORY_META[id]) {
          return CATEGORY_META[id];
        }
        return { name: id || "その他", color: "var(--cat-default)" };
      }

      function showState(which) {
        el.stateLoading.classList.toggle("is-visible", which === "loading");
        el.stateEmpty.classList.toggle("is-visible", which === "empty");
        el.stateError.classList.toggle("is-visible", which === "error");
      }

      /* generated_at (ISO8601) を日本語整形 */
      function formatUpdated(iso) {
        if (!iso) {
          return "更新時刻不明";
        }
        var d = new Date(iso);
        if (isNaN(d.getTime())) {
          return "更新: " + esc(iso);
        }
        var pad = function (n) {
          return n < 10 ? "0" + n : String(n);
        };
        return "更新 " + d.getFullYear() + "/" + pad(d.getMonth() + 1) + "/" + pad(d.getDate()) +
          " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
      }

      function formatPublished(pub) {
        if (!pub) {
          return "";
        }
        var d = new Date(pub);
        if (isNaN(d.getTime())) {
          return esc(pub);
        }
        return (d.getMonth() + 1) + "月" + d.getDate() + "日";
      }

      /* ---------- Rendering ---------- */

      function countItems(cat, importantOnly) {
        if (!cat || !cat.items) {
          return 0;
        }
        if (!importantOnly) {
          return cat.items.length;
        }
        return cat.items.filter(function (it) {
          return it && it.importance === "high";
        }).length;
      }

      function totalItems(importantOnly) {
        return state.categories.reduce(function (sum, cat) {
          return sum + countItems(cat, importantOnly);
        }, 0);
      }

      function renderFilters() {
        var frag = document.createDocumentFragment();

        var allBtn = buildChip("all", "すべて", totalItems(state.importantOnly), "");
        frag.appendChild(allBtn);

        state.categories.forEach(function (cat) {
          var meta = catMeta(cat.id);
          var count = countItems(cat, state.importantOnly);
          var chip = buildChip(cat.id, cat.name || meta.name, count, cat.color || meta.color);
          frag.appendChild(chip);
        });

        el.filters.innerHTML = "";
        el.filters.appendChild(frag);
      }

      function buildChip(id, label, count, color) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "c-chip" + (state.activeCategory === id ? " is-active" : "");
        if (color) {
          btn.style.setProperty("--chip-color", color);
        }
        btn.setAttribute("role", "tab");
        btn.setAttribute("aria-selected", state.activeCategory === id ? "true" : "false");
        btn.dataset.category = id;

        var text = document.createElement("span");
        text.textContent = label;
        btn.appendChild(text);

        var badge = document.createElement("span");
        badge.className = "c-chip__count";
        badge.textContent = count;
        btn.appendChild(badge);

        btn.addEventListener("click", function () {
          state.activeCategory = id;
          storeCategory(id);
          renderFilters();
          renderFeed();
        });

        return btn;
      }

      function renderFeed() {
        var html = "";
        var shown = 0;

        state.categories.forEach(function (cat) {
          if (state.activeCategory !== "all" && cat.id !== state.activeCategory) {
            return;
          }

          var items = (cat.items || []).filter(function (it) {
            if (!it) {
              return false;
            }
            if (state.importantOnly && it.importance !== "high") {
              return false;
            }
            return true;
          });

          if (items.length === 0) {
            return;
          }

          var meta = catMeta(cat.id);
          html += renderSectionHeading(cat, meta, items.length);

          items.forEach(function (it) {
            html += renderCard(it, cat, meta);
            shown += 1;
          });
        });

        if (shown === 0) {
          el.feed.innerHTML = "";
          showState("empty");
          return;
        }

        showState("none");
        el.feed.innerHTML = html;
      }

      function renderSectionHeading(cat, meta, count) {
        return '' +
          '<div class="p-section__heading" style="--cat-color:' + meta.color + '">' +
          '<span class="p-section__bar"></span>' +
          '<h2 class="p-section__name">' + esc(cat.name || meta.name) + '</h2>' +
          '<span class="p-section__num">' + count + '件</span>' +
          '</div>';
      }

      function renderCard(it, cat, meta) {
        var isHigh = it.importance === "high";
        var imp = IMPORTANCE_META[it.importance] || null;

        var badges = '<div class="c-card__badges">';
        badges += '<span class="c-badge c-badge--category">' + esc(cat.name || meta.name) + '</span>';

        if (imp) {
          badges += '<span class="c-badge c-badge--importance ' + imp.cls + '">' +
            iconDot() + esc(imp.label) + '</span>';
        }

        if (it.region) {
          badges += '<span class="c-badge c-badge--region">' +
            iconPin() + esc(it.region) + '</span>';
        }
        badges += '</div>';

        var title = '<h3 class="c-card__title">' + esc(it.title) + '</h3>';

        var summary = it.summary ?
          '<p class="c-card__summary">' + esc(it.summary) + '</p>' : '';

        var insight = '';
        if (it.why_it_matters) {
          insight = '' +
            '<div class="c-insight">' +
            '<svg class="c-insight__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
            '<path d="M9 18h6"></path>' +
            '<path d="M10 21h4"></path>' +
            '<path d="M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.2 1 2.5h6c0-1.3.3-1.8 1-2.5A6 6 0 0 0 12 3z"></path>' +
            '</svg>' +
            '<div class="c-insight__body">' +
            '<span class="c-insight__label">押さえる視点</span>' +
            '<p class="c-insight__text">' + esc(it.why_it_matters) + '</p>' +
            '</div>' +
            '</div>';
        }

        var sourceName = esc(it.source || "");
        var pubText = formatPublished(it.published);
        var footerInfo = '' +
          '<div class="c-card__source">' +
          (sourceName ? '<span class="c-card__source-name">' + sourceName + '</span>' : '') +
          (pubText ? '<span class="c-card__published">' + pubText + '</span>' : '') +
          '</div>';

        var link = '';
        if (isSafeUrl(it.url)) {
          link = '' +
            '<a class="c-link" href="' + esc(it.url) + '" target="_blank" rel="noopener noreferrer">' +
            '<span>記事を読む</span>' +
            '<svg class="c-link__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
            '<path d="M14 4h6v6"></path>' +
            '<path d="M20 4l-9 9"></path>' +
            '<path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"></path>' +
            '</svg>' +
            '</a>';
        }

        var footer = '<div class="c-card__footer">' + footerInfo + link + '</div>';

        return '' +
          '<article class="c-card' + (isHigh ? ' c-card--high' : '') + '" style="--cat-color:' + meta.color + '">' +
          badges + title + summary + insight + footer +
          '</article>';
      }

      function iconDot() {
        return '<svg class="c-badge__icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">' +
          '<circle cx="12" cy="12" r="5"></circle>' +
          '</svg>';
      }

      function iconPin() {
        return '<svg class="c-badge__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
          '<path d="M12 21s-6-5.3-6-10a6 6 0 0 1 12 0c0 4.7-6 10-6 10z"></path>' +
          '<circle cx="12" cy="11" r="2"></circle>' +
          '</svg>';
      }

      /* ---------- Header ---------- */

      function renderHeader(meta) {
        meta = meta || {};
        if (meta.date_label) {
          el.date.textContent = meta.date_label;
        }
        if (meta.coverage) {
          el.coverage.textContent = "対象: " + meta.coverage;
        } else {
          el.coverage.textContent = "";
        }
        el.updated.textContent = formatUpdated(meta.generated_at);

        var count = (typeof meta.item_count === "number") ? meta.item_count : totalItems(false);
        el.total.textContent = count + " 件";
      }

      /* ---------- Markdown 解析（書式仕様 v2） ---------- */

      function parseMarkdown(text) {
        var lines = String(text || "").replace(/\r\n?/g, "\n").split("\n");
        var meta = {};
        var i = 0;

        /* 先頭の空行をスキップ */
        while (i < lines.length && lines[i].trim() === "") {
          i += 1;
        }

        /* フロントマター（--- 〜 ---） */
        if (i < lines.length && lines[i].trim() === "---") {
          i += 1;
          while (i < lines.length && lines[i].trim() !== "---") {
            var raw = lines[i];
            var sep = raw.indexOf(":");
            if (sep > -1) {
              var key = raw.slice(0, sep).trim();
              var val = raw.slice(sep + 1).trim();
              if (key) {
                meta[key] = val;
              }
            }
            i += 1;
          }
          if (i < lines.length) {
            i += 1;
          }
        }

        var categories = [];
        var currentCat = null;
        var currentItem = null;

        function flushItem() {
          if (currentItem && currentCat) {
            currentCat.items.push(currentItem);
          }
          currentItem = null;
        }

        function ensureCategory() {
          if (!currentCat) {
            var resolved = resolveCategory("");
            currentCat = { id: resolved.id, name: "その他", color: resolved.color, items: [] };
            categories.push(currentCat);
          }
        }

        var reItem = /^###\s+(.+)$/;
        var reCat = /^##\s+(.+)$/;
        var reHead = /^\[\s*([^｜|]+?)\s*[｜|]\s*([^\]]+?)\s*\]\s*(.+)$/;
        var reSummary = /^概要[：:]\s*(.*)$/;
        var reInsight = /^視点[：:]\s*(.*)$/;
        var reSource = /^出典[：:]\s*(.*)$/;

        for (; i < lines.length; i += 1) {
          var line = lines[i].trim();
          if (line === "") {
            continue;
          }

          var mItem = reItem.exec(line);
          if (mItem) {
            flushItem();
            ensureCategory();
            var head = mItem[1].trim();
            var mHead = reHead.exec(head);
            var importance = "mid";
            var region = "";
            var title = head;
            if (mHead) {
              importance = normImportance(mHead[1]);
              region = mHead[2].trim();
              title = mHead[3].trim();
            }
            currentItem = {
              importance: importance,
              region: region,
              title: title,
              summary: "",
              why_it_matters: "",
              source: "",
              published: "",
              url: ""
            };
            continue;
          }

          var mCat = reCat.exec(line);
          if (mCat) {
            flushItem();
            var name = mCat[1].trim();
            var cat = resolveCategory(name);
            currentCat = { id: cat.id, name: name, color: cat.color, items: [] };
            categories.push(currentCat);
            continue;
          }

          if (currentItem) {
            var mSummary = reSummary.exec(line);
            if (mSummary) {
              currentItem.summary = mSummary[1].trim();
              continue;
            }
            var mInsight = reInsight.exec(line);
            if (mInsight) {
              currentItem.why_it_matters = mInsight[1].trim();
              continue;
            }
            var mSource = reSource.exec(line);
            if (mSource) {
              var parts = mSource[1].split(/[｜|]/);
              currentItem.source = (parts[0] || "").trim();
              currentItem.published = (parts[1] || "").trim();
              currentItem.url = (parts[2] || "").trim();
              continue;
            }
          }
        }

        flushItem();

        /* title を持つ項目のみ・空カテゴリを除外 */
        categories = categories
          .map(function (c) {
            c.items = c.items.filter(function (it) {
              return it && it.title;
            });
            return c;
          })
          .filter(function (c) {
            return c.items.length > 0;
          });

        var normMeta = {
          date: meta.date || "",
          date_label: meta.label || "",
          coverage: meta.coverage || "",
          generated_at: meta.updated || ""
        };
        var cnt = parseInt(meta.count, 10);
        if (!isNaN(cnt)) {
          normMeta.item_count = cnt;
        }

        return { meta: normMeta, categories: categories };
      }

      /* ---------- Date navigation ---------- */

      function indexOfDate(date) {
        for (var i = 0; i < state.dates.length; i += 1) {
          if (state.dates[i].date === date) {
            return i;
          }
        }
        return -1;
      }

      function renderDatenav(selected) {
        el.dateSelect.innerHTML = "";

        state.dates.forEach(function (d) {
          var opt = document.createElement("option");
          opt.value = d.date;
          var label = d.label || d.date;
          if (typeof d.count === "number" && !isNaN(d.count)) {
            label += "（" + d.count + "件）";
          }
          opt.textContent = label;
          el.dateSelect.appendChild(opt);
        });

        el.datenav.hidden = state.dates.length === 0;
        syncDatenav(selected);
      }

      /* 現在の日付に合わせてセレクト値と前後ボタンの活性を更新
         （state.dates は新しい日付が先頭＝index 0） */
      function syncDatenav(date) {
        if (date) {
          el.dateSelect.value = date;
        }
        var idx = indexOfDate(date);
        el.dateNewer.disabled = !(idx > 0);
        el.dateOlder.disabled = !(idx > -1 && idx < state.dates.length - 1);
      }

      /* ---------- Load ---------- */

      function loadManifest() {
        retryFn = loadManifest;
        showState("loading");
        el.controls.hidden = true;
        el.datenav.hidden = true;
        el.feed.innerHTML = "";

        fetch(MANIFEST_URL, { cache: "no-store" })
          .then(function (res) {
            if (!res.ok) {
              throw new Error("HTTP " + res.status);
            }
            return res.json();
          })
          .then(function (manifest) {
            var dates = (manifest && Array.isArray(manifest.dates)) ? manifest.dates : [];
            dates = dates
              .filter(function (d) {
                return d && d.date;
              })
              .map(function (d) {
                var c = parseInt(d.count, 10);
                return {
                  date: String(d.date),
                  label: d.label || String(d.date),
                  count: isNaN(c) ? undefined : c
                };
              });
            /* 新しい日付が先頭になるよう降順ソート */
            dates.sort(function (a, b) {
              if (a.date < b.date) {
                return 1;
              }
              if (a.date > b.date) {
                return -1;
              }
              return 0;
            });
            state.dates = dates;

            var initial = (manifest && manifest.latest) ?
              String(manifest.latest) :
              (dates[0] ? dates[0].date : null);

            if (!initial) {
              el.controls.hidden = true;
              el.datenav.hidden = true;
              el.feed.innerHTML = "";
              el.errorText.textContent = "配信可能なニュースがまだありません。しばらくしてから再度お試しください。";
              showState("error");
              return;
            }

            /* latest が dates に無い場合は先頭に補完 */
            if (indexOfDate(initial) === -1) {
              state.dates.unshift({ date: initial, label: initial, count: undefined });
            }

            renderDatenav(initial);
            loadDate(initial);
          })
          .catch(function (err) {
            el.controls.hidden = true;
            el.datenav.hidden = true;
            el.feed.innerHTML = "";
            el.errorText.textContent =
              "ニュース一覧の取得に失敗しました（" + esc(err.message) +
              "）。通信環境を確認して、再読み込みしてください。";
            showState("error");
          });
      }

      function loadDate(date) {
        state.currentDate = date;
        retryFn = function () {
          loadDate(date);
        };
        showState("loading");
        el.controls.hidden = true;
        el.feed.innerHTML = "";
        syncDatenav(date);

        fetch(mdUrl(date), { cache: "no-store" })
          .then(function (res) {
            if (!res.ok) {
              throw new Error("HTTP " + res.status);
            }
            return res.text();
          })
          .then(function (text) {
            var data = parseMarkdown(text);
            state.categories = data.categories;
            state.activeCategory = restoreCategory(state.categories);
            state.importantOnly = el.importantOnly.checked;

            renderHeader(data.meta);

            if (state.categories.length === 0) {
              el.controls.hidden = true;
              el.feed.innerHTML = "";
              el.errorText.textContent = "この日のニュースは配信されていません。別の日付を選択してください。";
              showState("error");
              return;
            }

            el.controls.hidden = false;
            renderFilters();
            renderFeed();
          })
          .catch(function (err) {
            el.controls.hidden = true;
            el.feed.innerHTML = "";
            el.errorText.textContent =
              "この日のニュースの取得に失敗しました（" + esc(err.message) +
              "）。通信環境を確認して、再読み込みしてください。";
            showState("error");
          });
      }

      /* ---------- Theme（既定は白。ダークは手動切替のみ） ---------- */

      var themeToggle = document.getElementById("js-theme-toggle");
      var themeColorMeta = document.getElementById("js-theme-color");

      function applyTheme(theme) {
        var isDark = theme === "dark";
        document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
        themeToggle.setAttribute("aria-label", isDark ? "ライトモードに切り替え" : "ダークモードに切り替え");
        themeToggle.setAttribute("aria-pressed", isDark ? "true" : "false");
        if (themeColorMeta) {
          themeColorMeta.setAttribute("content", isDark ? "#121417" : "#ffffff");
        }
      }

      applyTheme(document.documentElement.getAttribute("data-theme"));

      themeToggle.addEventListener("click", function () {
        var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
        applyTheme(next);
        try {
          localStorage.setItem("mb-theme", next);
        } catch (e) {
          /* 保存できない環境では今回の表示のみ切り替える */
        }
      });

      /* ---------- Events ---------- */

      el.importantOnly.addEventListener("change", function () {
        state.importantOnly = el.importantOnly.checked;
        renderFilters();
        renderFeed();
      });

      el.dateSelect.addEventListener("change", function () {
        loadDate(el.dateSelect.value);
      });

      el.dateNewer.addEventListener("click", function () {
        var idx = indexOfDate(state.currentDate);
        if (idx > 0) {
          loadDate(state.dates[idx - 1].date);
        }
      });

      el.dateOlder.addEventListener("click", function () {
        var idx = indexOfDate(state.currentDate);
        if (idx > -1 && idx < state.dates.length - 1) {
          loadDate(state.dates[idx + 1].date);
        }
      });

      el.retry.addEventListener("click", function () {
        if (typeof retryFn === "function") {
          retryFn();
        } else {
          loadManifest();
        }
      });

      /* ---------- Init ---------- */

      loadManifest();
    })();
  </script>
</body>
</html>
